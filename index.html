<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>GitHub Lines of Code — Rolling 7 Days</title>
<style>
  :root { color-scheme: light dark; }
  html, body { background: #0f172a; }
  body { font-family: ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; margin: 0; padding: 10px 14px 6px; font-size: 12.5px; line-height: 1.35; color: #e2e8f0; }
  @media (prefers-color-scheme: light) { html, body { background: #ffffff; } body { color: #1e293b; } }
  h1 { font-size: 13px; margin: 0 0 2px; font-weight: 600; }
  .meta { font-size: 10px; opacity: .55; margin-bottom: 6px; }
  .trend-title { font-size: 10px; text-transform: uppercase; letter-spacing: .05em; opacity: .6; margin: 4px 0 2px; }
  table { width: 100%; border-collapse: collapse; }
  th, td { text-align: right; padding: 3px 8px; white-space: nowrap; }
  th:first-child, td:first-child { text-align: left; }
  th { font-size: 9px; text-transform: uppercase; letter-spacing: .05em; opacity: .65; border-bottom: 1px solid rgba(148,163,184,.35); }
  td { border-bottom: 1px solid rgba(148,163,184,.12); font-variant-numeric: tabular-nums; }
  tr.total td { border-top: 2px solid rgba(148,163,184,.45); border-bottom: none; font-weight: 700; }
  .pos { color: #4ade80; } .neg { color: #f87171; } .zero { color: inherit; }
  @media (prefers-color-scheme: light) { .pos { color: #16a34a; } .neg { color: #dc2626; } }
  .error { color: #f87171; padding: 8px; }
  .empty { opacity: .6; padding: 6px 0; }
</style>
</head>
<body>
  <h1>GitHub — lines of code</h1>
  <div class="meta" id="meta"></div>
  <div class="trend-title">Net lines per day — all repos · rolling 7 days</div>
  <div id="trend">Loading…</div>
  <div id="content"></div>
<script>
const DAILY = "./stats/daily.json";
const WEEKLY = "./stats/weekly.json"; // fallback while daily.json is not published yet

let dailyData = null;

async function load() {
  try {
    dailyData = await tryFetch(DAILY);
    if (dailyData) {
      renderTrendLine();
      renderTable();
      return;
    }
    // Older deployment: only the flat 7-day snapshot exists. Show it rather
    // than an error, but make it clear the per-day series is missing.
    const weekly = await tryFetch(WEEKLY);
    if (!weekly) throw new Error("no stats published yet");
    renderNoTrend();
    renderTableFromWeekly(weekly);
  } catch (e) {
    document.getElementById("content").innerHTML =
      '<div class="error">Failed to load stats: ' + e.message + "</div>";
  }
}

async function tryFetch(path) {
  const r = await fetch(path, { cache: "no-store" });
  if (!r.ok) return null;
  return r.json().catch(() => null);
}

function days() {
  return (dailyData && Array.isArray(dailyData.days)) ? dailyData.days : [];
}

function dayNet(day) {
  let net = 0;
  for (const s of Object.values(day.repos || {})) net += s.net || 0;
  return net;
}

function renderNoTrend() {
  document.getElementById("trend").innerHTML =
    '<div class="meta">Per-day series not published yet — run the stats workflow</div>';
}

function shortDay(iso) {
  const d = new Date(iso + "T00:00:00Z");
  return d.toLocaleDateString(undefined, { month: "short", day: "numeric", timeZone: "UTC" });
}

function renderTrendLine() {
  const series = days().map((d) => ({ date: d.date, net: dayNet(d) }));
  if (series.length < 2) {
    document.getElementById("trend").innerHTML = '<div class="meta">Not enough daily data yet</div>';
    return;
  }
  const W = 320, H = 84, padL = 6, padR = 6, padT = 8, padB = 18;
  const maxV = Math.max(0, ...series.map((s) => s.net));
  const minV = Math.min(0, ...series.map((s) => s.net));
  const range = Math.max(maxV - minV, 1);
  const plotW = W - padL - padR, plotH = H - padT - padB;
  const x = (i) => padL + (i * plotW) / (series.length - 1);
  const y = (v) => padT + ((maxV - v) / range) * plotH;
  const zeroY = y(0);
  const pts = series.map((s, i) => x(i).toFixed(1) + "," + y(s.net).toFixed(1));
  let area = "M" + pts[0];
  for (let i = 1; i < pts.length; i++) area += " L" + pts[i];
  area += " L" + x(series.length - 1).toFixed(1) + "," + zeroY.toFixed(1)
    + " L" + x(0).toFixed(1) + "," + zeroY.toFixed(1) + " Z";
  let circles = "";
  let labels = "";
  const today = new Date().toISOString().slice(0, 10);
  series.forEach((s, i) => {
    const cx = x(i).toFixed(1), cy = y(s.net).toFixed(1);
    const c = s.net > 0 ? "#4ade80" : s.net < 0 ? "#f87171" : "#94a3b8";
    const partial = s.date === today ? " (today, partial)" : "";
    const tip = shortDay(s.date) + ": " + (s.net >= 0 ? "+" : "") + s.net + " net lines" + partial;
    circles += '<circle cx="' + cx + '" cy="' + cy + '" r="2.6" fill="' + c + '">'
      + "<title>" + tip + "</title></circle>";
    labels += '<text x="' + cx + '" y="' + (H - 5) + '" font-size="8" text-anchor="middle" fill="currentColor" opacity=".7">'
      + shortDay(s.date) + "</text>";
  });
  const svg = '<svg viewBox="0 0 ' + W + " " + H + '" style="width:100%;max-width:420px" preserveAspectRatio="xMidYMid meet">'
    + '<line x1="' + padL + '" y1="' + zeroY.toFixed(1) + '" x2="' + (W - padR) + '" y2="' + zeroY.toFixed(1)
    + '" stroke="rgba(148,163,184,.35)" stroke-width="1"/>'
    + '<path d="' + area + '" fill="rgba(96,165,250,.12)" stroke="none"/>'
    + '<polyline points="' + pts.join(" ") + '" fill="none" stroke="#60a5fa" stroke-width="1.6" stroke-linejoin="round" stroke-linecap="round"/>'
    + circles + labels + "</svg>";
  document.getElementById("trend").innerHTML = svg;
}

function netCls(v) { return v > 0 ? "pos" : v < 0 ? "neg" : "zero"; }
function cell(v, c) { return '<td class="' + c + '">' + v.toLocaleString() + "</td>"; }

function paint(rows, generatedAt) {
  let totalAdded = 0, totalDeleted = 0, totalNet = 0;
  for (const r of rows) {
    totalAdded += r.a; totalDeleted += r.d; totalNet += r.n;
  }
  rows.sort((x, y) => y.n - x.n);
  let html = '<table><thead><tr><th>Repository</th><th>Added</th><th>Removed</th><th>Net</th></tr></thead><tbody>';
  for (const r of rows) {
    html += "<tr><td>" + r.repo + "</td>"
      + cell(r.a, r.a > 0 ? "pos" : "zero")
      + cell(r.d, r.d > 0 ? "neg" : "zero")
      + cell(r.n, netCls(r.n)) + "</tr>";
  }
  html += '<tr class="total"><td>Total (' + rows.length + " repos)</td>"
    + cell(totalAdded, totalAdded > 0 ? "pos" : "zero")
    + cell(totalDeleted, totalDeleted > 0 ? "neg" : "zero")
    + cell(totalNet, netCls(totalNet)) + "</tr></tbody></table>";
  document.getElementById("content").innerHTML =
    rows.length ? html : '<div class="empty">No line changes in the last 7 days</div>';
  document.getElementById("meta").textContent =
    "Rolling last 7 days · Updated " + gen(generatedAt) + " — refreshed daily by GitHub Actions";
}

function gen(iso) {
  if (!iso) return "unknown";
  const d = new Date(iso);
  const day = d.toLocaleDateString(undefined, { month: "short", day: "numeric" });
  const time = d.toLocaleTimeString(undefined, { hour: "2-digit", minute: "2-digit" });
  return day + " " + time;
}

function renderTable() {
  const totals = {};
  for (const d of days()) {
    for (const [repo, s] of Object.entries(d.repos || {})) {
      const t = totals[repo] || (totals[repo] = { repo, a: 0, d: 0, n: 0 });
      t.a += s.added || 0;
      t.d += s.deleted || 0;
      t.n += s.net || 0;
    }
  }
  paint(Object.values(totals).filter((r) => r.a || r.d), dailyData.generated_at);
}

function renderTableFromWeekly(data) {
  const rows = [];
  for (const [repo, s] of Object.entries(data)) {
    if (repo === "generated_at") continue;
    const a = s.added || 0, d = s.deleted || 0;
    if (!a && !d) continue;
    rows.push({ repo, a, d, n: s.net || 0 });
  }
  paint(rows, data.generated_at);
}

load();
</script>
<script>
(function () {
  if (window.parent === window) return;
  function reportHeight() {
    try {
      // Measure the real content, NOT the document root. Once Homepage grows
      // this iframe taller than the page, documentElement.scrollHeight stops
      // reporting our content and instead tracks the iframe's own (ever-taller)
      // height -- a feedback loop that stretches the card a little more on
      // every cycle. <body> has no height/min-height, so its offsetHeight is
      // the page's actual content height and stays constant.
      var h = Math.ceil(document.body ? document.body.offsetHeight : 0);
      if (h > 0) {
        window.parent.postMessage({ type: 'homepage-iframe-resize', height: h }, '*');
      }
    } catch (e) {}
  }
  if (document.readyState === 'complete') { reportHeight(); }
  else { window.addEventListener('load', reportHeight); }
  setInterval(reportHeight, 1500);
})();
</script>
</body>
</html>
