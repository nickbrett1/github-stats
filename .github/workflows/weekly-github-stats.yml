name: github-stats

on:
  schedule:
    - cron: "17 6 * * *" # daily 06:17 UTC — keeps the 7-day window rolling
  workflow_dispatch:
  push:
    branches: [main]
permissions:
  contents: write
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  stats:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Compute rolling daily stats
        env:
          GH_TOKEN: ${{ secrets.GH_STATS_TOKEN }}
        run: python .github/scripts/weekly_stats.py --days 7 --out stats/daily.json --legacy stats/weekly.json
      - name: Commit and push
        run: |
          git config user.name "github-stats-bot"
          git config user.email "actions@users.noreply.github.com"
          git add stats/daily.json stats/weekly.json
          if git diff --cached --quiet; then
            echo "no changes to stats"
          else
            git commit -m "chore: refresh rolling github stats"
            git push
          fi
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: .
  deploy:
    needs: stats
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
